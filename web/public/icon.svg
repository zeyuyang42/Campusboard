<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824px rounded square centred with 100px margins -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363A44"/>
      <stop offset="1" stop-color="#1D1F25"/>
    </linearGradient>
    <radialGradient id="disc" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2B2E36"/>
      <stop offset="1" stop-color="#121317"/>
    </radialGradient>
    <radialGradient id="label" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7CCBE2"/>
      <stop offset="1" stop-color="#3F9DB9"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EEE9" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#F1EEE9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="square"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g clip-path="url(#square)">
    <!-- the record, slightly off-centre so it reads as pulled from a sleeve -->
    <circle cx="560" cy="540" r="330" fill="url(#disc)"/>
    <g fill="none" stroke="#F1EEE9" stroke-opacity="0.07" stroke-width="6">
      <circle cx="560" cy="540" r="300"/><circle cx="560" cy="540" r="268"/><circle cx="560" cy="540" r="236"/><circle cx="560" cy="540" r="204"/><circle cx="560" cy="540" r="172"/>
    </g>
    <circle cx="560" cy="540" r="330" fill="url(#sheen)"/>
    <circle cx="560" cy="540" r="118" fill="url(#label)"/>
    <circle cx="560" cy="540" r="16" fill="#121317"/>
    <!-- sleeve edge: a warm band along the left, like the album art peeking out -->
    <rect x="100" y="100" width="150" height="824" fill="#F1EEE9" fill-opacity="0.06"/>
  </g>
</svg>
