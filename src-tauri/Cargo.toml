[package]
name = "bandcamp-player"
version = "0.3.0"
description = "Personal Bandcamp player"
authors = ["Bandcamp Player contributors"]
edition = "2021"

[lib]
name = "bandcamp_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# unsafe-headers: lets core send the optional Bandcamp identity cookie (Cookie is a forbidden
# header otherwise). No "cookies" feature: without a jar, Set-Cookie from a logged-in
# response is never stored and replayed, so the cookie goes only where core sends it.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
