[package]
name = "bandcamp-player"
version = "0.9.0"
description = "Campusboard, a personal Bandcamp player"
authors = ["Campusboard contributors"]
edition = "2021"

[lib]
name = "bandcamp_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the optional menu-bar icon (tray.rs), off unless turned on in Settings.
# protocol-asset: <audio> plays offline copies (#2) from asset://, scoped at runtime to the
# offline folder only (lib.rs `offline_dir`); it serves Range requests for seeking.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# unsafe-headers: lets core send the optional Bandcamp identity cookie (Cookie is a forbidden
# header otherwise). No "cookies" feature: without a jar, Set-Cookie from a logged-in
# response is never stored and replayed, so the cookie goes only where core sends it.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Track-change notifications (Settings, off by default). Desktop: notify-rust, which on
# macOS is mac-notification-sys.
tauri-plugin-notification = "2"
# Native alert for startup failures, shown before the app (and the dialog plugin) exists.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Selftest only (debug builds): turn off WKWebView's occlusion detection, the same objc2 wry links.
objc2 = "0.6"

[dev-dependencies]
# Only to build MigrateError values in tests; the same sqlx the sql plugin links.
sqlx = { version = "0.8", default-features = false, features = ["migrate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
